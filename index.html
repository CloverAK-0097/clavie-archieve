<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Your Eyes Only</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
            color: #f0f0f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Spotlight effect */
        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.07) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .login-card {
            background: #111113;
            border: 1px solid #222;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            z-index: 10;
            text-align: center;
            transition: all 0.5s ease;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #fff;
            font-weight: 500;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background: #1a1a1e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #666;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #f0f0f0;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background: #ffffff;
        }

        button:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: #ff5c5c;
            font-size: 0.8rem;
            margin-top: 10px;
            min-height: 20px;
        }

        .hidden {
            display: none;
        }

        /* Success reveal view */
        #success-container {
            text-align: center;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #success-container.fade-in {
            opacity: 1;
        }

        #success-container h1 {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        #success-container p {
            color: #aaa;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="login-card" id="card-box">
        <!-- Step 1: OC Name -->
        <div id="step-1">
            <h2>Access Verification</h2>
            <p class="subtitle">State your clearance.</p>
            <div class="input-group">
                <input type="text" id="answer-1" placeholder="What's your OC's name?" autocomplete="off">
            </div>
            <button onclick="checkStep1()">Continue</button>
            <div class="error-msg" id="error-1"></div>
        </div>

        <!-- Step 2: Birthday -->
        <div id="step-2" class="hidden">
            <h2>Authentication Step 2</h2>
            <p class="subtitle">Confirm the date.</p>
            <div class="input-group">
                <input type="text" id="answer-2" placeholder="Enter birthday..." autocomplete="off">
            </div>
            <button onclick="checkStep2()">Unlock</button>
            <div class="error-msg" id="error-2"></div>
        </div>

        <!-- Success Reveal View inside Card -->
        <div id="success-container" class="hidden">
            <h1>Access Granted 🤍</h1>
            <p>Redirecting to your surprise...</p>
        </div>
    </div>

    <script>
        function cleanText(str) {
            return str.trim().toLowerCase().replace(/\s+/g, ' ');
        }

        function checkStep1() {
            const val = cleanText(document.getElementById('answer-1').value);
            const errorDiv = document.getElementById('error-1');
            
            // Acceptable answers for Step 1
            const validAnswers = ["avy kumo", "cloverfield hosterson"];

            if (validAnswers.includes(val)) {
                errorDiv.textContent = "";
                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-2').classList.remove('hidden');
                document.getElementById('answer-2').focus();
            } else {
                errorDiv.textContent = "Access denied. Unrecognized input.";
            }
        }

        function checkStep2() {
            const val = cleanText(document.getElementById('answer-2').value);
            const errorDiv = document.getElementById('error-2');
            
            // Acceptable answers for Step 2
            const validAnswers = ["22 october", "19 october"];

            if (validAnswers.includes(val)) {
                errorDiv.textContent = "";
                document.getElementById('step-2').classList.add('hidden');
                
                const successBox = document.getElementById('success-container');
                successBox.classList.remove('hidden');
                setTimeout(() => successBox.classList.add('fade-in'), 50);

                // Here is where it will redirect once she logs in successfully!
                // You can change 'main-content.html' later to whatever your actual birthday page file name will be.
                setTimeout(() => {
                    window.location.href = "main-content.html"; 
                }, 2000);

            } else {
                errorDiv.textContent = "Incorrect date format or value.";
            }
        }

        // Allow pressing "Enter" key to submit
        document.getElementById('answer-1').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkStep1();
        });
        document.getElementById('answer-2').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkStep2();
        });
    </script>
</body>
</html>
